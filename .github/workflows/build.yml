name: Build and test Windows bundle

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache native toolchain and OBS runtime
        uses: actions/cache@v4
        with:
          path: |
            .build/toolchain
            .build/obs-sdk
            .build/obs-runtime
          key: windows-zig-0.17.0-obs-32.2.2

      - name: Download official OBS runtime for integration tests
        shell: pwsh
        run: |
          if (-not (Test-Path '.build/obs-runtime/bin/64bit/obs.dll')) {
            New-Item -ItemType Directory -Force -Path '.build' | Out-Null
            Invoke-WebRequest -Uri 'https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-Windows-x64.zip' -OutFile '.build/obs-runtime.zip'
            $expected = '4d6e40e3ab155f56b30de517380566a206d74b63cdf5ad49aa596924768f97e1'
            if ((Get-FileHash -Algorithm SHA256 '.build/obs-runtime.zip').Hash -ne $expected) {
              throw 'OBS runtime checksum mismatch'
            }
            Expand-Archive -LiteralPath '.build/obs-runtime.zip' -DestinationPath '.build/obs-runtime' -Force
          }

      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -ObsBinPath '.build/obs-runtime/bin/64bit'

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: vaobs-windows-live-alignment
          path: |
            dist/vaobs-audio-align.dll
            dist/vaobs-windows-live-alignment.zip
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/vaobs-windows-live-alignment.zip --title "VaOBS $env:GITHUB_REF_NAME" --notes-file README.md --verify-tag
